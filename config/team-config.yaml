# Team configuration for Kill Team datacards
# Defines team metadata including faction, army, and name aliases
# faction: imperium, chaos, xenos
# army: specific army within the faction
# aliases: list of alternative names detected in source PDFs
# tokens_ready: optional boolean (default: false)
#   - false: tokens are still being iterated/tuned and are NOT included in TTS box/state
#   - true:  tokens are considered "locked" and will be included in TTS box/state

