version: '3'

# Kill Team Datacards Pipeline Task Runner
# Install: https://taskfile.dev/installation/
# Usage: task all                       # Run full pipeline
#        task pipeline:extract          # Run specific step
#        task infra:check-env           # Setup/utility tasks

vars:
  PYTHON:
    sh: |
      if [ "{{OS}}" = "windows" ]; then
        echo ".venv/Scripts/python.exe"
      else
        echo ".venv/bin/python"
      fi
  BRANCH: '{{.BRANCH | default "main"}}'

env:
  KT_BRANCH: '{{.BRANCH}}'

tasks:
  # ============================================================================
  # MAIN TASK - Run everything
  # ============================================================================
  
  all:
    desc: πŸš€ Run full pipeline (all steps)
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step all --branch {{.BRANCH}}'

  # ============================================================================
  # PIPELINE STEPS - Individual pipeline operations
  # ============================================================================

  pipeline:process:
    desc: πŸ"„ Process PDFs and identify teams
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step process --branch {{.BRANCH}}'

  pipeline:extract:
    desc: πŸ–ΌοΈ  Extract card images from PDFs
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step extract --branch {{.BRANCH}}'

  pipeline:backsides:
    desc: πŸ"™ Add backsides to cards
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step backsides --branch {{.BRANCH}}'

  pipeline:urls:
    desc: πŸ"— Generate datacards-urls.json
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step urls --branch {{.BRANCH}}'

  pipeline:tokens:
    desc: 🎲 Generate token integration
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step tokens --branch {{.BRANCH}}'

  pipeline:team:
    desc: πŸ'₯ Run pipeline for specific team(s) (e.g., task pipeline:team TEAMS="kasrkin")
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step all --teams {{.TEAMS}} --branch {{.BRANCH}}'
    requires:
      vars: [TEAMS]

  pipeline:team-extract:
    desc: Extract images for specific team(s)
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step extract --teams {{.TEAMS}} --branch {{.BRANCH}}'
    requires:
      vars: [TEAMS]

  pipeline:deploy-acc:
    desc: πŸš€ Deploy with acc branch URLs
    cmds:
      - task: all
        vars:
          BRANCH: acc

  pipeline:deploy-dev:
    desc: πŸš€ Deploy with dev branch URLs
    cmds:
      - task: all
        vars:
          BRANCH: dev

  pipeline:deploy-main:
    desc: πŸš€ Deploy with main branch URLs (default)
    cmds:
      - task: all
        vars:
          BRANCH: main

  # ============================================================================
  # INFRA & SETUP - Environment and utility commands
  # ============================================================================

  infra:check-env:
    desc: βœ… Check environment setup
    cmds:
      - '{{.PYTHON}} --version'
      - '{{.PYTHON}} -c "import fitz; import yaml; import PIL; print(''✓ Core dependencies installed'')"'

  infra:test-imports:
    desc: πŸ§ͺ Test all Python imports
    cmds:
      - '{{.PYTHON}} -c "import sys; sys.path.insert(0, ''script''); from pipeline.pipeline import DatacardPipeline; print(''✓ Pipeline imports successful'')"'
      - '{{.PYTHON}} -c "import sys; sys.path.insert(0, ''script''); from generators.objects.tts_objects import TTSObjectGenerator; print(''✓ TTS generators imports successful'')"'
      - '{{.PYTHON}} -c "import sys; sys.path.insert(0, ''script''); from config import GITHUB_BRANCH, get_github_url; print(f''✓ Config imports successful (branch: {GITHUB_BRANCH})'')"'

  infra:test-team:
    desc: πŸ§ͺ Test pipeline on a small team (kasrkin by default)
    vars:
      TEST_TEAM: '{{.TEST_TEAM | default "kasrkin"}}'
    cmds:
      - '{{.PYTHON}} script/run_pipeline.py --step all --teams {{.TEST_TEAM}} --branch {{.BRANCH}} -v'

  infra:clean-logs:
    desc: 🧹 Clean log files
    cmds:
      - cmd: Remove-Item -Path "*.log" -ErrorAction SilentlyContinue
        platforms: [windows]
      - cmd: rm -f *.log
        platforms: [linux, darwin]

  infra:gen-tts:
    desc: Generate TTS objects for all teams
    cmds:
      - '{{.PYTHON}} script/generators/generate.py --branch {{.BRANCH}}'

  infra:gen-metadata:
    desc: Generate metadata files
    cmds:
      - '{{.PYTHON}} script/generators/metadata/generate.py --branch {{.BRANCH}}'

  infra:format:
    desc: πŸ"§ Format Python code (requires black)
    cmds:
      - '{{.PYTHON}} -m black script/'

  infra:lint:
    desc: πŸ"§ Lint Python code (requires pylint)
    cmds:
      - '{{.PYTHON}} -m pylint script/'

  infra:help:
    desc: πŸ"– Show available tasks
    cmds:
      - task --list

  # ============================================================================
  # USAGE EXAMPLES
  # ============================================================================
  # task all                               # Run full pipeline
  # task pipeline:extract                  # Run specific step
  # task pipeline:team TEAMS="kasrkin"     # Process single team
  # task pipeline:deploy-acc               # Deploy with acc branch
  # task infra:check-env                   # Verify environment
  # task infra:test-team                   # Quick test run
  # ============================================================================
